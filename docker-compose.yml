version: '3.8'
networks:
  ailab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
x-llm-env: &llm-env
  OLLAMA_HOST: ${OLLAMA_HOST}
  LLM_PROVIDER: ${LLM_PROVIDER}
  LLM_MODEL: ${LLM_MODEL}
  API_PROVIDER: ${API_PROVIDER}
  API_KEY: ${API_KEY}

services:
  # ============ DATABASES ============
  postgres-db:
    image: postgres:15
    container_name: nimble-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: Nimble_DB_2026!
      POSTGRES_DB: nimbletech_internal
    ports:
      - "5432:5432"
    volumes:
      - ./db-init/postgres:/docker-entrypoint-initdb.d
    networks:
      ailab:
        ipv4_address: 172.30.0.10
  mssql-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nimble-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "NimbleStrong!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    networks:
      ailab:
        ipv4_address: 172.30.0.11
  chromadb:
    image: chromadb/chroma:latest
    container_name: nimble-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      ailab:
        ipv4_address: 172.30.0.12
  # ============ MAIN WEB APP ============
  nimbletech-web:
    build: ./apps/nimbletech-web
    container_name: nimble-web
    ports:
      - "5000:5000"
    environment:
      <<: *llm-env
    networks:
      ailab:
        ipv4_address: 172.30.0.20
    volumes:
      - ./shared/llm_client.py:/app/llm_client.py:ro
  # ============ PROMPT INJECTION LABS ============
